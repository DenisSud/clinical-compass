<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Ни maximum-scale, ни user-scalable=no: экспорт запрещает масштаб (system §4,
         пункт 8), а это отнимает у пациента WCAG 1.4.4. viewport-fit=cover это то,
         от чего отсчитываются безопасные отступы липкой шапки в base.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Клинический компас</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
