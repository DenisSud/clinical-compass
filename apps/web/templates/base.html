<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Клинический компас{% endblock %}</title>
  <link rel="stylesheet" href="/ux/tokens.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="/">Клинический компас</a>
      {% if user %}
      <nav class="nav">
        {% if user.role == 'doctor' %}
          <a href="/panel">Пациенты</a>
          <a href="/visits">Приёмы</a>
        {% else %}
          <a href="/today">Сегодня</a>
          <a href="/my">Мои записи</a>
        {% endif %}
        <form method="post" action="/logout"><button class="btn ghost" type="submit">Выйти</button></form>
      </nav>
      {% endif %}
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
