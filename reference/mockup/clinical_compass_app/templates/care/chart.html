{% load l10n %}<section class="panel" id="wellbeing"><div class="section-heading"><div><h2>Динамика самочувствия</h2><p class="muted">Личная оценка 1–10 · последняя запись за каждую дату</p></div><span class="pill neutral">Дневник, не шкала</span></div>
{% if chart %}<div class="chart-wrap"><svg viewBox="0 0 560 225" role="img" aria-label="Личная оценка самочувствия по датам, от 1 до 10. Пропущенные оценки не заменены нулём."><line x1="40" y1="31" x2="540" y2="31" class="grid-line"/><line x1="40" y1="95" x2="540" y2="95" class="grid-line"/><line x1="40" y1="175" x2="540" y2="175" class="grid-line"/><text x="8" y="35" class="axis-label">10</text><text x="14" y="99" class="axis-label">6</text><text x="14" y="179" class="axis-label">1</text>{% for point in chart %}{% if point.value != None %}<circle cx="{{ point.x|unlocalize }}" cy="{{ point.y|unlocalize }}" r="6" class="chart-point"><title>{{ point.date|date:'d.m.Y' }}: {{ point.value }} / 10</title></circle>{% else %}<text x="{{ point.x|unlocalize }}" y="155" text-anchor="middle" class="axis-label">нет оценки</text>{% endif %}<text x="{{ point.x|unlocalize }}" y="207" text-anchor="middle" class="axis-label">{{ point.date|date:'d.m' }}</text>{% endfor %}</svg></div>{% else %}<div class="empty-state"><p>Здесь появятся ваши личные оценки по датам.</p></div>{% endif %}<small class="help">Это наблюдения по самоотчёту. Изменение баллов само по себе не доказывает эффект лечения.</small></section>
